evaluation:
  attenuation_factor: 1.0
  mc_method: maxcurvature
  min_magnitude: 0.0
  reference_distance: 1.0
paths:
  base_dir: template_matching
  catalog_file: null
  output_dir: results
  plots_dir: plots
  template_info_file: template_info.csv
  templates_dir: templates_dlf
squirrel:
  persistent: eifel3
stations:
  channels:
  - Z
  - N
  - E
  lat: 50.114
  lon: 7.9021
  primary_channel: E
  station_code: OCHT
template_creation:
  filter_max: 30.0
  filter_min: 0.7
  lta_window: 5.0
  onset_thr_off: 1.0
  onset_thr_on: 3.5
  post_event: 5.0
  pre_event: 0.5
  sta_window: 0.5
  noise_window: 1.0
  # Optional: path to a pyrocko snuffler markers file to use for template cuts.
  # If provided, markers will be parsed and used as onset/end overrides per station.
  # Example: 'tests/markers.dlf' or '/data/markers.dlf'
  snuffler_markers_file: '/home/plaumann/slink_qseek/template_matching/dlf_picks'
  # Tolerance (seconds) when matching an event to nearest marker start if no enclosing pair found
  marker_match_tolerance: 2.0
template_matching:
  cluster_eps: 0.2
  days_to_process: 1
  distance_samples: 200
  min_spike_ratio: 3.0
  n_jobs: 1
  post_amplitude: 6.0
  pre_amplitude: 0.5
  similarity_threshold: 0.5
  start_date: '2018-01-01'
  min_snr: -1000.0
